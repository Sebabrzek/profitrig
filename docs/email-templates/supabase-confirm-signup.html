<!--
  Supabase → Authentication → Email Templates → "Confirm signup"
  Subject: Confirm your ProfitRig account

  Paste everything below this comment into the message body. The link goes
  to ProfitRig's own /auth/confirm page, which signs the driver in on any
  device and opens the Calculator. Only change it after the code that adds
  /auth/confirm is live.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f9f5e9;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e5e2d8;border-radius:14px;">
        <tr>
          <td style="padding:24px 28px 4px;font-family:Helvetica,Arial,sans-serif;font-size:20px;font-weight:800;color:#173c2b;">ProfitRig</td>
        </tr>
        <tr>
          <td style="padding:12px 28px 4px;font-family:Helvetica,Arial,sans-serif;font-size:22px;font-weight:800;line-height:1.25;color:#173c2b;">Confirm your email to finish signing up</td>
        </tr>
        <tr>
          <td style="padding:8px 28px 20px;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;color:#1f2937;">
            You just created a ProfitRig account for {{ .Email }}. Tap the button and you're in.
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 24px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#173c2b;color:#ffffff;font-family:Helvetica,Arial,sans-serif;font-weight:700;font-size:16px;text-decoration:none;padding:13px 22px;border-radius:10px;">Confirm my email</a>
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 24px;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#667085;">
            Didn't sign up? Ignore this email and nothing happens.
          </td>
        </tr>
      </table>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
        <tr>
          <td style="padding:14px 28px;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.08em;color:#173c2b;">KNOW YOUR NUMBERS. TAKE CONTROL.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
